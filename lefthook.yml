pre-commit:
  parallel: true

  commands:
    frontend-eslint:
      root: frontend/
      glob: "*.{js,jsx,ts,tsx}"
      run: npx eslint {staged_files}

    frontend-prettier:
      root: frontend/
      glob: "*.{js,jsx,ts,tsx,json,css,md}"
      run: npx prettier --write {staged_files}

    backend-ruff:
      root: backend/
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}

    backend-format:
      root: backend/
      glob: "*.py"
      run: uv run ruff format {staged_files}

pre-push:
  parallel: true

  commands:
    frontend:
      root: frontend/
      run: npm run check

    backend-lint:
      root: backend/
      run: uv run ruff check .

    backend-format:
      root: backend/
      run: uv run ruff format --check .
