[project]
name = "rag-backend"
version = "0.1.0"
description = "FastAPI backend for the local RAG application"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "litellm>=1.100.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
